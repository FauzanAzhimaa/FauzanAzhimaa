<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Fauzan Azhima, Information Technology student">
<style>
.tr{fill:none;stroke:#1a7f37;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nd{fill:#ffffff;stroke:#1a7f37;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.in{}
.cur{animation:blink 1s steps(1) infinite}
.led{animation:led 1.6s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{50%{opacity:0}}
@keyframes led{0%,100%{opacity:.25}50%{opacity:1}}
</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#eaeef2"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="14"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="300" fill="#ffffff"/>
<rect width="1200" height="300" fill="url(#dots)"/>
<rect width="1200" height="300" fill="url(#fade)"/>
