<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="CuciKuy · Laundry POS: Multi-tenant SaaS for laundry shops: owner and cashier roles, branches, and subscription tiers enforced in the API. One codebase ships to web, Android, and desktop.">
<style>.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.3}}</style>
<defs>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#241d36"/></pattern>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" x2="600" y1="0" y2="0">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".45" stop-color="#a78bfa"/><stop offset=".55" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="598" height="298" rx="16"/></clipPath>
<radialGradient id="gl"><stop offset="0" stop-color="#c084fc" stop-opacity=".35"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
</defs><g clip-path="url(#clip)"><rect width="600" height="300" fill="#13101c"/><rect width="600" height="300" fill="url(#dots)" opacity=".8"/><rect width="600" height="2.5" fill="url(#edge)"/></g><rect x="1" y="1" width="598" height="298" rx="16" fill="none" stroke="#2d2540" stroke-width="1.5"/>
<circle cx="542" cy="56" r="58" fill="url(#gl)"><animate attributeName="r" values="50;64;50" dur="4s" repeatCount="indefinite"/></circle>
<g transform="translate(520 31)"><rect x="0" y="0" width="44" height="50" rx="7" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="12" x2="44" y2="12" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="6" r="1.6" fill="#c084fc"/><circle cx="22" cy="31" r="12" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 33 q4 -5 8 0 t8 0" fill="none" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 22 31" to="360 22 31" dur="3s" repeatCount="indefinite"/></path></g>
<circle class="pulse" cx="38" cy="47" r="4.5" fill="#c084fc"/>
<text x="52" y="52" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#a79fc2">Private · demo on request</text>
<text x="32" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f3f0ff" letter-spacing="-.4">CuciKuy · Laundry POS</text>
<text y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#a79fc2"><tspan x="32" dy="0">Multi-tenant SaaS for laundry shops: owner and cashier</tspan><tspan x="32" dy="25">roles, branches, and subscription tiers enforced in the</tspan><tspan x="32" dy="25">API. One codebase ships to web, Android, and desktop.</tspan></text>
<rect x="32" y="236" width="62" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="63" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">React</text><rect x="102" y="236" width="71" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="138" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">NestJS</text><rect x="181" y="236" width="103" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="233" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">PostgreSQL</text><rect x="292" y="236" width="95" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="340" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Capacitor</text><rect x="395" y="236" width="62" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="426" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Tauri</text><rect x="466" y="236" width="87" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="509" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Midtrans</text>
</svg>
