<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Smart Water Gate: Open, close, and schedule a paddy-field water gate from the browser. An ESP32 gateway relays commands over LoRa 433 MHz to the gate node that drives the motor.">
<style>.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.3}}</style>
<defs>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#241d36"/></pattern>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" x2="600" y1="0" y2="0">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".45" stop-color="#a78bfa"/><stop offset=".55" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="598" height="298" rx="16"/></clipPath>
<radialGradient id="gl"><stop offset="0" stop-color="#c084fc" stop-opacity=".35"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
</defs><g clip-path="url(#clip)"><rect width="600" height="300" fill="#13101c"/><rect width="600" height="300" fill="url(#dots)" opacity=".8"/><rect width="600" height="2.5" fill="url(#edge)"/></g><rect x="1" y="1" width="598" height="298" rx="16" fill="none" stroke="#2d2540" stroke-width="1.5"/>
<circle cx="542" cy="56" r="58" fill="url(#gl)"><animate attributeName="r" values="50;64;50" dur="4s" repeatCount="indefinite"/></circle>
<g transform="translate(520 31)"><line x1="4" y1="0" x2="4" y2="50" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="40" y1="0" x2="40" y2="50" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="6" width="28" height="20" rx="2" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="y" values="6;12;6" dur="3s" repeatCount="indefinite"/></rect><path d="M0 40 q5.5 -5 11 0 t11 0 t11 0 t11 0" fill="none" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0 0;-11 0;0 0" dur="2s" repeatCount="indefinite"/></path></g>
<circle class="pulse" cx="38" cy="47" r="4.5" fill="#c084fc"/>
<text x="52" y="52" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#a79fc2">Private · research project</text>
<text x="32" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f3f0ff" letter-spacing="-.4">Smart Water Gate</text>
<text y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#a79fc2"><tspan x="32" dy="0">Open, close, and schedule a paddy-field water gate from</tspan><tspan x="32" dy="25">the browser. An ESP32 gateway relays commands over LoRa</tspan><tspan x="32" dy="25">433 MHz to the gate node that drives the motor.</tspan></text>
<rect x="32" y="236" width="62" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="63" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">ESP32</text><rect x="102" y="236" width="54" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="130" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">LoRa</text><rect x="165" y="236" width="87" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="208" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Firebase</text><rect x="260" y="236" width="79" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="299" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Laravel</text>
</svg>
