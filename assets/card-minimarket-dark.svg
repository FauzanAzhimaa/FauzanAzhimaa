<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Minimarket Management: Point of sale with admin and cashier roles, batch stock tracking with expiry dates, sales reports, and Telegram alerts before products expire.">
<style>.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.3}}</style>
<defs>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#241d36"/></pattern>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" x2="600" y1="0" y2="0">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".45" stop-color="#a78bfa"/><stop offset=".55" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="598" height="298" rx="16"/></clipPath>
<radialGradient id="gl"><stop offset="0" stop-color="#c084fc" stop-opacity=".35"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
</defs><g clip-path="url(#clip)"><rect width="600" height="300" fill="#13101c"/><rect width="600" height="300" fill="url(#dots)" opacity=".8"/><rect width="600" height="2.5" fill="url(#edge)"/></g><rect x="1" y="1" width="598" height="298" rx="16" fill="none" stroke="#2d2540" stroke-width="1.5"/>
<circle cx="542" cy="56" r="58" fill="url(#gl)"><animate attributeName="r" values="50;64;50" dur="4s" repeatCount="indefinite"/></circle>
<g transform="translate(520 31)"><path d="M0 4 H8 L14 34 H40 L44 12 H11" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="44" r="4" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="37" cy="44" r="4" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><g stroke="#a78bfa" stroke-width="2"><line x1="20" y1="17" x2="20" y2="28"/><line x1="25" y1="17" x2="25" y2="28"/><line x1="29" y1="17" x2="29" y2="28"/><line x1="34" y1="17" x2="34" y2="28"/></g><line x1="17" y1="22.5" x2="38" y2="22.5" stroke="#c084fc" stroke-width="1.8"><animate attributeName="opacity" values="1;.15;1" dur="1.6s" repeatCount="indefinite"/></line></g>
<circle class="pulse" cx="38" cy="47" r="4.5" fill="#c084fc"/>
<text x="52" y="52" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#a79fc2">Private · demo on request</text>
<text x="32" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f3f0ff" letter-spacing="-.4">Minimarket Management</text>
<text y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#a79fc2"><tspan x="32" dy="0">Point of sale with admin and cashier roles, batch stock</tspan><tspan x="32" dy="25">tracking with expiry dates, sales reports, and Telegram</tspan><tspan x="32" dy="25">alerts before products expire.</tspan></text>
<rect x="32" y="236" width="71" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="67" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Python</text><rect x="111" y="236" width="62" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="142" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Flask</text><rect x="181" y="236" width="79" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="220" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">MongoDB</text><rect x="268" y="236" width="119" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="327" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Telegram Bot</text>
</svg>
