<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Waste Vision: CNN that rates an area as clean, light pile, or heavy pile, shows why with a Grad-CAM heatmap, and ranks locations by how urgently they need cleanup.">
<style>.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.3}}</style>
<defs>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#241d36"/></pattern>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" x2="600" y1="0" y2="0">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".45" stop-color="#a78bfa"/><stop offset=".55" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="598" height="298" rx="16"/></clipPath>
<radialGradient id="gl"><stop offset="0" stop-color="#c084fc" stop-opacity=".35"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
</defs><g clip-path="url(#clip)"><rect width="600" height="300" fill="#13101c"/><rect width="600" height="300" fill="url(#dots)" opacity=".8"/><rect width="600" height="2.5" fill="url(#edge)"/></g><rect x="1" y="1" width="598" height="298" rx="16" fill="none" stroke="#2d2540" stroke-width="1.5"/>
<circle cx="542" cy="56" r="58" fill="url(#gl)"><animate attributeName="r" values="50;64;50" dur="4s" repeatCount="indefinite"/></circle>
<g transform="translate(520 31)"><path d="M0 12 V4 a4 4 0 0 1 4 -4 H12 M32 0 H40 a4 4 0 0 1 4 4 V12 M44 38 V46 a4 4 0 0 1 -4 4 H32 M12 50 H4 a4 4 0 0 1 -4 -4 V38" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="11" y="16" width="22" height="18" rx="3" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="4" y1="10" x2="40" y2="10" stroke="#c084fc" stroke-width="2.2"><animate attributeName="y1" values="8;42;8" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y2" values="8;42;8" dur="2.6s" repeatCount="indefinite"/></line></g>
<circle class="pulse" cx="38" cy="47" r="4.5" fill="#c084fc"/>
<text x="52" y="52" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#a79fc2">Open source  ↗</text>
<text x="32" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f3f0ff" letter-spacing="-.4">Waste Vision</text>
<text y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#a79fc2"><tspan x="32" dy="0">CNN that rates an area as clean, light pile, or heavy</tspan><tspan x="32" dy="25">pile, shows why with a Grad-CAM heatmap, and ranks</tspan><tspan x="32" dy="25">locations by how urgently they need cleanup.</tspan></text>
<rect x="32" y="236" width="103" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="84" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">TensorFlow</text><rect x="143" y="236" width="62" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="174" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Keras</text><rect x="214" y="236" width="87" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="257" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Grad-CAM</text><rect x="308" y="236" width="54" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="336" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">YOLO</text><rect x="371" y="236" width="62" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="402" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Flask</text><rect x="441" y="236" width="71" height="30" rx="15" fill="#1e1830" stroke="#2d2540"/><text x="476" y="255.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#e0d7ff">Docker</text>
</svg>
